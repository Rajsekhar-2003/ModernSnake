
name: Build Godot Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build ModernSnake APK
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout source code
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 4. Install Android build packages
      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      # 5. Download Godot 4.5
      - name: Download Godot Engine
        run: |
          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip

          unzip -q Godot_v4.5-stable_linux.x86_64.zip

          chmod +x Godot_v4.5-stable_linux.x86_64

          sudo mv Godot_v4.5-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      # 6. Download Android export templates
      - name: Install Godot Export Templates
        run: |
          wget -q --show-progress \
            https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz

          mkdir -p "$RUNNER_TEMP/godot-templates"

          unzip -q Godot_v4.5-stable_export_templates.tpz \
            -d "$RUNNER_TEMP/godot-templates"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -r "$RUNNER_TEMP/godot-templates/templates/." \
            "$TEMPLATE_DIR/"

          if [ -f "$RUNNER_TEMP/godot-templates/version.txt" ]; then
            cp "$RUNNER_TEMP/godot-templates/version.txt" \
              "$TEMPLATE_DIR/version.txt"
          fi

          test -f "$TEMPLATE_DIR/android_debug.apk"
          test -f "$TEMPLATE_DIR/android_release.apk"

      # 7. Validate project
      - name: Validate Godot Project
        run: |
          test -f project.godot
          test -f export_presets.cfg

          godot --headless \
            --editor \
            --path . \
            --quit

      # 8. Build Android APK
      - name: Export Android APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/ModernSnake.apk

          test -s build/ModernSnake.apk

          echo "APK successfully created!"

          ls -lh build/ModernSnake.apk

      # 9. Upload APK
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ModernSnake-Android-APK
          path: build/ModernSnake.apk
          if-no-files-found: error
          retention-days: 14
